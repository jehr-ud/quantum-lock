<header class="header">

    <div>

        <h1>

            {{ title() }}

        </h1>

        <p>

            {{ subtitle() }}

        </p>

    </div>

    @if(showLogout()){

        <button
            class="logout-btn"
            type="button"
            [disabled]="logouting()"
            (click)="logout.emit()">

            {{ logouting() ? 'Cerrando sesión…' : 'Cerrar sesión' }}

        </button>

    }

</header>
