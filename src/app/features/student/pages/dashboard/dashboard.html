<div class="page">

    <app-course-header

        title="Mis cursos"

        subtitle="Completa el Quantum Lock para registrar tu asistencia."

        [showLogout]="true"

        [logouting]="logouting()"

        (logout)="logout()">

    </app-course-header>

    @if(logoutError()){

    <div class="logout-message">

        ❌ {{ logoutError() }}

    </div>

    }

    <app-course-list

        [courses]="courses()"
        actionText="Comenzar"
        (action)="openCourse($event)"
        secondaryActionText="🕷️ Álbum"
        (secondaryAction)="openAlbum($event)">

    </app-course-list>

</div>
