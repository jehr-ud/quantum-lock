<div class="register-container">

    <div class="card">

        <div class="logo">

            ⚛️

        </div>

        <h1>Quantum Lock</h1>

        <p class="subtitle">

            Crear una cuenta

        </p>

        <div class="field">

            <label>Nombres</label>

            <input type="text" [ngModel]="firstName()" (ngModelChange)="firstName.set($event)" placeholder="Jorge">

        </div>

        <div class="field">

            <label>Apellidos</label>

            <input type="text" [ngModel]="lastName()" (ngModelChange)="lastName.set($event)"
                placeholder="Hernández Pérez">

        </div>

        <div class="field">

            <label>Correo institucional</label>

            <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
                placeholder="usuario@udistrital.edu.co">

        </div>

        <div class="field">

            <label>Contraseña</label>

            <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)">

        </div>

        <div class="field">

            <label>Confirmar contraseña</label>

            <input type="password" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)">

        </div>

        @if(error()) {

        <div class="error">

            {{ error() }}

        </div>

        }

        <button (click)="register()" [disabled]="loading()">

            @if(loading()){

            Creando cuenta...

            } @else {

            Crear cuenta

            }

        </button>

        <div class="footer">

            ¿Ya tienes una cuenta?

            <a routerLink="/login">

                Iniciar sesión

            </a>

        </div>

    </div>

</div>
