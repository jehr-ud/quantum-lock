<div class="dashboard">

    <app-course-header

        title="Mis cursos"

        subtitle="Selecciona un curso para iniciar una nueva sesión."

        [showLogout]="true"

        [logouting]="logouting()"

        (logout)="logout()">

    </app-course-header>

    @if(logoutError()){

    <div class="logout-message error">

        ❌ {{ logoutError() }}

    </div>

    }

    @if(exportingCourseId()){

    <div class="export-message">

        ⏳ Generando reporte de asistencia...

    </div>

    }

    @if(exportError()){

    <div class="export-message error">

        ❌ {{ exportError() }}

    </div>

    }

    <app-course-list

        [courses]="courses()"

        actionText="Iniciar clase"

        (action)="startSession($event)"

        secondaryActionText="Exportar asistencia"

        (secondaryAction)="exportAttendance($event)">

    </app-course-list>

</div>

@if(sessionCreated(); as session){

    <app-session-created-dialog

        [session]="session"

        (enter)="enterSession()"

        (close)="closeDialog()">

    </app-session-created-dialog>

}
